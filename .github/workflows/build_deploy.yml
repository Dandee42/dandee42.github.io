name: Build and Deploy

on:
  push:
    branches:
      - production
      - develop

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repozitáře
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Nastavení Ruby + instalace gemů z Gemfile.lock (s cache)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # 3. Build Jekyll webu
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # 4. Kontrola interních odkazů a obrázků (absolutní URL na vlastní doménu se kontrolují jako interní)
      - name: Check links
        run: >
          bundle exec htmlproofer ./_site
          --disable-external
          --allow-missing-href
          --swap-urls '^https\://daniel-hladik\.cz:'

      # 5a. Deploy production branch to GitHub Pages
      - name: Deploy to GitHub Pages (production)
        if: github.ref == 'refs/heads/production'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: production-gh-pages
          commit_message: "Deploy production - ${{ github.sha }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # 5b. Deploy develop branch to GitHub Pages (náhled: v Settings → Pages se dočasně přepne zdroj na develop-gh-pages)
      - name: Deploy to GitHub Pages (develop)
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: develop-gh-pages
          commit_message: "Deploy develop preview - ${{ github.sha }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
