# ----------------------------------------------------------
# SITE SETTINGS
# ----------------------------------------------------------
source: site
title:
  cs: Daniel Hladík
  en: Daniel Hladik
description:
  cs: Stavím webové aplikace, AI řešení, automatizace i weby, od nápadu po spuštění. S ohledem na bezpečnost, škálovatelnost a udržovatelnost.
  en: I build web applications, AI solutions, automations and websites, from idea to launch. With a focus on security, scalability and maintainability.
taglong:
  cs: AI Product Builder
  en: AI Product Builder
tagshort:
  cs: AI Product Builder
  en: AI Product Builder

baseurl: ""
url: https://daniel-hladik.cz

remote_theme: piazzai/cvless

# ----------------------------------------------------------
# ALERT MESSAGE
# ----------------------------------------------------------

alert: # Message in the alert has to be setup in the language files (_data)
  enabled: true # Visibility of alert message (true/false)
  type: "notice" # Type of alert (notice, warning, error)
  dismissable: true # Possibility to hide alert by the user (true/false)

# ----------------------------------------------------------
# AUTHOR INFO
# ----------------------------------------------------------

author:
  name: Daniel Hladík
  email: info&#64;daniel-hladik&#46;cz
photo: assets/files/photo.png
og_image: assets/files/photo.png
address: Praha 6
phone:

# ----------------------------------------------------------
# SOCIAL SITES
# ----------------------------------------------------------

social:
  github:
  linkedin: daniel-hladik
  facebook:
  instagram:
  x:
  stackoverflow:

# ----------------------------------------------------------
# BUILD SETTINGS
# ----------------------------------------------------------

exclude:
  - docker-compose.yml
  - LICENSE
  - README.md

permalink: /blog/:slug/

# ----------------------------------------------------------
# COLLECTIONS
# ----------------------------------------------------------

collections:
  pages:
    output: true

# ----------------------------------------------------------
# POLYGLOT SETTINGS
# ----------------------------------------------------------

languages: ["cs", "en"]
default_lang: "cs"
# lang_from_path: false
exclude_from_localization:
  - assets/
  - sitemap.xml
  - sitemap_cs.xml
  - sitemap_en.xml
  - robots.txt
  - CNAME
  - docker.compose.yml
parallel_localization: false # set to true if you have a lot of posts/pages (doesn't work on Windows)

# ----------------------------------------------------------
# DATA PAGES GENERATOR
# ----------------------------------------------------------
page_gen-dirs: true

page_gen:
  - data: "services"
    template: "service"
    name: "slug"
    dir: "services"
    filter: published
    lang: lang
  - data: "use_cases"
    template: "use-case"
    name: "slug"
    dir: "use-cases"
    filter: published
    lang: lang
  - data: "glossary"
    template: "glossary-term"
    name: "slug"
    dir: "glossary"
    filter: published
    lang: lang

# ----------------------------------------------------------
# AUTOPAGES (CATEGORIES, TAGS)
# ----------------------------------------------------------

autopages:
  enabled: true
  tags:
    enabled: true
    layouts:
      - "autopage_tag.html"
    title: "#:tag"
    permalink: "/tag/:tag/"

  categories:
    enabled: true
    layouts:
      - "autopage_category.html"
    title: ":cat"
    permalink: "/:cat/"
  collections:
    enabled: false

# ----------------------------------------------------------
# PAGINATION
# ----------------------------------------------------------

pagination:
  enabled: true
  per_page: 3
  sort_reverse: true
  permalink: /:num/
  title: ":title &middot; :num"

# ----------------------------------------------------------
# PLUGINS
# ----------------------------------------------------------

plugins:
  - jekyll-gist
  - jekyll-paginate-v2
  - jekyll-polyglot
  - jekyll-last-modified-at
  - jekyll-redirect-from
  - jekyll-datapage-generator

# ----------------------------------------------------------
# ANALYTICS
# ----------------------------------------------------------

google_analytics: G-5FNL9M65H0 # Insert your GA4 Measurement ID, e.g.: G-XXXXXXXXXX

# ----------------------------------------------------------
# STYLE
# ----------------------------------------------------------

sass:
  style: compressed
  sourcemap: never
