h1: "Jaké služby nabízím?"
use_cases_intro: "Služby popisují, co umím. Ale zajímá vás, jak to vypadá v praxi? Připravil jsem přehled konkrétních firemních problémů — s popisem, co přesně automatizuji a jaký to má dopad."
use_cases_link: "Prohlédnout konkrétní řešení"
all_services_link: "← Všechny služby"
service_link: "Zjistit více"
lead: "Věřím, že nejdůležitější není otázka „jak“ něco vytvořit, ale „co“ a „proč“ tvoříme. Samotná cesta a výběr nástrojů pak přirozeně vyplynou z hledání cesty k cíli. Každý problém může mít mnoho řešení a mým úkolem je najít takové, které bude nejlépe vyhovovat právě vašim potřebám."