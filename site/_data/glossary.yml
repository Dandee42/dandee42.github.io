        <h2>Co je LangChain?</h2>
        <p><strong>LangChain</strong> je open-source framework pro vývoj aplikací poháněných velkými jazykovými modely (LLM). Poskytuje předpřipravenou architekturu pro agenty a integrace pro jakýkoliv model nebo nástroj.</p>
        <h3>Klíčové vlastnosti</h3>
        <ul>
          <li><strong>Řetězení:</strong> Propojování více LLM volání a nástrojů do komplexních workflow</li>
          <li><strong>Agenti:</strong> Vytváření autonomních AI agentů, kteří se rozhodují na základě kontextu</li>
          <li><strong>Integrace:</strong> Podpora stovek nástrojů, databází a API</li>
          <li><strong>Paměť:</strong> Správa konverzační historie a kontextu</li>
        </ul>
