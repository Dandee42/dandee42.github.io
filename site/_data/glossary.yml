        <h2>What is Markdown?</h2>
        <p><strong>Markdown</strong> is a lightweight markup language used to edit plain text and convert it into formatted text that can be published on the web (HTML). The text is easy to read even in its original format.</p>
        <h3>Use in AI</h3>
        <p>AI models understand text in Markdown format better than raw HTML, which is why HTML content is often converted to Markdown when preparing data for RAG systems.</p>

- page_id: chunking
  type: glossary
  slug: chunking
  term: Chunking
  categories: [rag]
  date: 2026-04-21 +02:00
  published: true
  icon: view_module
  lang:
    cs:
      title: "Chunking"
      description: "Co je chunking? Proces rozdělení dlouhého textu na menší, logické celky (chunky) pro efektivní zpracování v RAG systémech."
      short_definition: "Proces rozdělení dlouhého textu na menší, logické celky (chunky) pro efektivní zpracování v RAG systémech."
      text: |
        <h2>Co je chunking?</h2>
        <p><strong>Chunking</strong> je proces rozdělení dlouhého textu na menší, logické celky - tzv. chunky (kousky). Jde o klíčový krok při přípravě dat pro RAG systémy.</p>
        <h3>Proč je chunking důležitý</h3>
        <p>LLM modely mají omezené kontextové okno. Místo předhození celého dokumentu najednou se modelu předloží pouze relevantní kousky, čímž se šetří tokeny a zvyšuje přesnost odpovědí.</p>
        <h3>Typické parametry</h3>
        <ul>
          <li><strong>Velikost chunku:</strong> 500–1 000 znaků</li>
          <li><strong>Překryv:</strong> 10–20 % - aby se neztratil kontext mezi sousedními chunky</li>
          <li><strong>Dělení:</strong> Podle odstavců, nadpisů nebo logických celků</li>
        </ul>
    en:
      title: "Chunking"
      description: "What is chunking? The process of dividing long text into smaller, logical units (chunks) for efficient processing in RAG systems."
      short_definition: "The process of dividing long text into smaller, logical units (chunks) for efficient processing in RAG systems."
      text: |
        <h2>What is chunking?</h2>
        <p><strong>Chunking</strong> is the process of dividing a long text into smaller, logical units - called chunks. It is a key step when preparing data for RAG systems.</p>
        <h3>Why chunking matters</h3>
        <p>LLM models have a limited context window. Instead of presenting the entire document at once, only relevant chunks are passed to the model, saving tokens and increasing response accuracy.</p>
        <h3>Typical parameters</h3>
        <ul>
          <li><strong>Chunk size:</strong> 500–1,000 characters</li>
          <li><strong>Overlap:</strong> 10–20% - to maintain context between adjacent chunks</li>
          <li><strong>Splitting:</strong> By paragraphs, headings, or logical sections</li>
        </ul>

