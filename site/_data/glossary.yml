- page_id: rag
  type: glossary
  slug: rag
  term: RAG
  categories: [rag, llm]
  date: 2026-04-21 +02:00
  published: true
  icon: manage_search
  lang:
    cs:
      title: "RAG (Retrieval-Augmented Generation)"
      description: "Co je RAG? Proces, kdy si AI nejdříve přečte vaše dokumenty a až pak odpoví uživateli. Vysvětlení RAG v kontextu AI automatizace."
      short_definition: "Proces, kdy si AI nejdříve přečte vaše dokumenty a až pak odpoví uživateli."
      text: |
        <h2>Co je RAG?</h2>
        <p><strong>RAG (Retrieval-Augmented Generation)</strong> se překládá do češtiny jako <em>generování rozšířené o vyhledávání</em>. Jedná se o techniku, díky které váš AI model „nehalucinuje" (nevymýšlí si), ale odpovědi generuje na základě znalostní databáze, kterou mu vy sami předložíte.</p>
        <h3>Jak RAG funguje</h3>
        <p>Běžný AI model je jako velmi vzdělaný člověk, který však od určitého data přestal sledovat novinky a nezná nic o vašem konkrétním byznysu. RAG tento problém řeší tak, že modelu v momentě dotazu předloží relevantní informace z vaší databáze.</p>
        <ol>
          <li><strong>Příprava dat:</strong> Dokumenty se rozsekají na menší části a pomocí embedding modelu se převedou na vektory, které se uloží do vektorové databáze.</li>
          <li><strong>Zpracování dotazu:</strong> Když se uživatel zeptá, systém převede dotaz na vektor a najde nejbližší kontextovou shodu v databázi.</li>
          <li><strong>Generování odpovědi:</strong> Nalezené odstavce se přibalí k otázce a pošlou LLM modelu, který z nich sestaví finální odpověď.</li>
        </ol>
        <h3>Kdy se RAG hodí</h3>
        <ul>
          <li>Interní znalostní báze - zaměstnanci se ptají systému místo procházení dokumentů</li>
          <li>Zákaznická podpora - chatbot odpovídající z vašich manuálů a FAQ</li>
          <li>Analýza dokumentů - rychlé hledání v právních smlouvách nebo technické dokumentaci</li>
        </ul>
    en:
      title: "RAG (Retrieval-Augmented Generation)"
      description: "What is RAG? A process in which AI first reads your documents and then responds to the user. RAG explained in the context of AI automation."
      short_definition: "A process in which AI first reads your documents and then responds to the user."
      text: |
        <h2>What is RAG?</h2>
        <p><strong>RAG (Retrieval-Augmented Generation)</strong> is a technique that prevents your AI model from "hallucinating" (making things up) by generating answers based on a knowledge base that you provide.</p>
        <h3>How RAG works</h3>
        <p>A regular AI model is like a highly educated person who stopped following the news after a certain date and knows nothing about your specific business. RAG solves this problem by presenting relevant information from your database to the model at query time.</p>
        <ol>
          <li><strong>Data preparation:</strong> Documents are split into smaller chunks and converted into vectors using an embedding model, then stored in a vector database.</li>
          <li><strong>Query processing:</strong> When a user asks a question, the system converts the query into a vector and finds the closest contextual match in the database.</li>
          <li><strong>Answer generation:</strong> The found paragraphs are bundled with the question and sent to the LLM, which composes the final answer.</li>
        </ol>
        <h3>When RAG is the right fit</h3>
        <ul>
          <li>Internal knowledge base - employees ask the system instead of digging through documents</li>
          <li>Customer support - a chatbot answering from your manuals and FAQ</li>
          <li>Document analysis - fast search through legal contracts or technical documentation</li>
        </ul>

- page_id: llm
  type: glossary
  slug: llm
  term: LLM
  categories: [llm]
  date: 2026-04-21 +02:00
  published: true
  icon: psychology
  lang:
    cs:
      title: "LLM (Large Language Model)"
      description: "Co je LLM? Velký jazykový model je typ umělé inteligence vytrénovaný na obrovském množství textu, který dokáže rozumět lidské řeči a generovat text."
      short_definition: "Velký jazykový model - typ AI vytrénovaný na obrovském množství textu, který dokáže rozumět lidské řeči a generovat text."
      text: |
        <h2>Co je LLM?</h2>
        <p><strong>LLM (Large Language Model)</strong>, česky <em>velký jazykový model</em>, je typ umělé inteligence vytrénovaný na obrovském množství textu. Slouží jako „mozek" celého systému, který dokáže rozumět lidské řeči, generovat text a logicky uvažovat.</p>
        <h3>Jak LLM funguje</h3>
        <p>LLM je natrénován na miliardách textových dokumentů - knih, článků, webových stránek a dalších zdrojů. Díky tomuto tréninku si model vytvoří statistický „smysl" pro jazyk: ví, jaká slova a věty obvykle následují za sebou, a dokáže generovat smysluplné odpovědi.</p>
        <h3>Příklady LLM</h3>
        <ul>
          <li><strong>GPT-4</strong> (OpenAI) - pohání ChatGPT</li>
          <li><strong>Claude</strong> (Anthropic) - zaměřený na bezpečnost a užitečnost</li>
          <li><strong>Gemini</strong> (Google) - integrovaný do služeb Google</li>
          <li><strong>Llama</strong> (Meta) - open-source model</li>
        </ul>
    en:
      title: "LLM (Large Language Model)"
      description: "What is an LLM? A Large Language Model is a type of AI trained on vast amounts of text that can understand human language and generate text."
      short_definition: "A type of AI trained on vast amounts of text that can understand human language and generate text."
      text: |
        <h2>What is an LLM?</h2>
        <p><strong>LLM (Large Language Model)</strong> is a type of artificial intelligence trained on vast amounts of text. It serves as the "brain" of the entire system, capable of understanding human language, generating text, and reasoning logically.</p>
        <h3>How LLMs work</h3>
        <p>An LLM is trained on billions of text documents - books, articles, websites, and other sources. Through this training, the model develops a statistical "sense" for language: it knows which words and sentences typically follow each other and can generate meaningful responses.</p>
        <h3>Examples of LLMs</h3>
        <ul>
          <li><strong>GPT-4</strong> (OpenAI) - powers ChatGPT</li>
          <li><strong>Claude</strong> (Anthropic) - focused on safety and helpfulness</li>
          <li><strong>Gemini</strong> (Google) - integrated into Google services</li>
          <li><strong>Llama</strong> (Meta) - open-source model</li>
        </ul>

