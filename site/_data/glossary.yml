      title: "FAQ (Frequently Asked Questions)"
      description: "What is FAQ? A structured list of commonly asked questions and answers that address the most frequent user concerns."
      short_definition: "A structured list of commonly asked questions and answers that address the most frequent user concerns."
      text: |
        <h2>What is FAQ?</h2>
        <p><strong>FAQ (Frequently Asked Questions)</strong> is a structured list of questions and answers that address the most common concerns users have about a product, service, or topic.</p>
        <h3>Why FAQ matters</h3>
        <ul>
          <li>Reduces customer support workload</li>
          <li>Improves user experience - answers are available instantly</li>
          <li>Serves as quality input data for <a href="/en/glossary/rag/">RAG systems</a> and AI <a href="/en/glossary/chatbot/">chatbots</a></li>
        </ul>

- page_id: langchain
  type: glossary
  slug: langchain
  term: LangChain
  categories: [automation, llm]
  date: 2026-04-21 +02:00
  published: true
  icon: link
  lang:
    cs:
      title: "LangChain"
      description: "Co je LangChain? Open-source framework s předpřipravenou architekturou pro AI agenty a integracemi pro jakýkoliv model nebo nástroj."
      short_definition: "Open-source framework s předpřipravenou architekturou pro AI agenty a integracemi pro jakýkoliv model nebo nástroj."
      text: |
        <h2>Co je LangChain?</h2>
        <p><strong>LangChain</strong> je open-source framework pro vývoj aplikací poháněných velkými jazykovými modely (<a href="/glossary/llm/">LLM</a>). Poskytuje předpřipravenou architekturu pro agenty a integrace pro jakýkoliv model nebo nástroj.</p>
        <h3>Klíčové vlastnosti</h3>
        <ul>
          <li><strong>Řetězení:</strong> Propojování více LLM volání a nástrojů do komplexních <a href="/glossary/workflow/">workflow</a></li>
          <li><strong>Agenti:</strong> Vytváření autonomních <a href="/glossary/agentni-systemy/">AI agentů</a>, kteří se rozhodují na základě kontextu</li>
          <li><strong>Integrace:</strong> Podpora stovek nástrojů, databází a <a href="/glossary/api/">API</a></li>
          <li><strong>Paměť:</strong> Správa konverzační historie a kontextu</li>
        </ul>
    en:
      title: "LangChain"
      description: "What is LangChain? An open-source framework with ready-made architecture for AI agents and integrations for any model or tool."
      short_definition: "An open-source framework with ready-made architecture for AI agents and integrations for any model or tool."
      text: |
        <h2>What is LangChain?</h2>
        <p><strong>LangChain</strong> is an open-source framework for developing applications powered by large language models (<a href="/en/glossary/llm/">LLMs</a>). It provides ready-made architecture for agents and integrations for any model or tool.</p>
        <h3>Key features</h3>
        <ul>
          <li><strong>Chaining:</strong> Connecting multiple LLM calls and tools into complex <a href="/en/glossary/workflow/">workflows</a></li>
          <li><strong>Agents:</strong> Creating autonomous <a href="/en/glossary/agentni-systemy/">AI agents</a> that make decisions based on context</li>
          <li><strong>Integrations:</strong> Support for hundreds of tools, databases, and <a href="/en/glossary/api/">APIs</a></li>
          <li><strong>Memory:</strong> Managing conversation history and context</li>
        </ul>

- page_id: agentni-systemy
  type: glossary
  slug: agentni-systemy
  term: Agentní systémy
  categories: [llm, automation]
  date: 2026-04-21 +02:00
  published: true
  icon: smart_toy
  lang:
    cs:
      title: "Agentní systémy (AI agenti)"
      description: "Co jsou agentní systémy? Pokročilé implementace AI, které samostatně rozhodují o postupu k dosažení stanoveného cíle."
      short_definition: "Pokročilé implementace AI, které samostatně rozhodují o postupu k dosažení stanoveného cíle."
      text: |
        <h2>Co jsou agentní systémy?</h2>
        <p><strong>Agentní systémy</strong> (nebo AI agenti) jsou pokročilé implementace umělé inteligence, které nefungují podle předem daného scénáře, ale samostatně rozhodují o postupu k dosažení stanoveného cíle.</p>
        <h3>Rozdíl oproti běžným chatbotům</h3>
        <ul>
          <li><strong><a href="/glossary/chatbot/">Chatbot</a>:</strong> Odpovídá na otázky podle předem definovaných pravidel nebo znalostí</li>
          <li><strong>AI agent:</strong> Sám vyhledává informace, volá <a href="/glossary/api/">API</a>, zapisuje do databáze a rozhoduje se, co dělat jako další</li>
        </ul>
        <h3>Příklady využití</h3>
        <ul>
          <li>Automatické třídění a odpovídání na e-maily</li>
          <li>Plánování schůzek a správa kalendáře</li>
          <li>Analýza dokumentů a generování reportů</li>
        </ul>
    en:
      title: "Agent Systems (AI Agents)"
      description: "What are agent systems? Advanced AI implementations that independently decide on steps to achieve a set goal."
      short_definition: "Advanced AI implementations that independently decide on steps to achieve a set goal."
      text: |
        <h2>What are agent systems?</h2>
        <p><strong>Agent systems</strong> (or AI agents) are advanced implementations of artificial intelligence that do not operate according to a predetermined scenario, but independently decide on the steps to achieve a set goal.</p>
        <h3>Difference from regular chatbots</h3>
        <ul>
          <li><strong><a href="/en/glossary/chatbot/">Chatbot</a>:</strong> Answers questions based on predefined rules or knowledge</li>
          <li><strong>AI agent:</strong> Independently searches for information, calls <a href="/en/glossary/api/">APIs</a>, writes to databases, and decides what to do next</li>
        </ul>
        <h3>Use cases</h3>
        <ul>
          <li>Automatic email sorting and responding</li>
          <li>Meeting scheduling and calendar management</li>
          <li>Document analysis and report generation</li>
        </ul>

