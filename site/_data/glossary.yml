        <h2>What is a sitemap?</h2>
        <p>A <strong>sitemap</strong> is a file, usually in XML format, that contains a list of all the important URLs on your website. It is primarily used by search engine robots (e.g., Google) to crawl and index your website more effectively.</p>
        <h3>Use in automation</h3>
        <p>In the context of <a href="/en/glossary/rag/">RAG systems</a>, a sitemap serves as a starting point for automatically downloading website content into a <a href="/en/glossary/vektorova-databaze/">vector database</a>.</p>

