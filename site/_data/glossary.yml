      short_definition: "Digitální zpráva, kterou jeden počítač posílá druhému pro získání nebo předání dat."
      text: |
        <h2>Co je HTTP požadavek?</h2>
        <p><strong>HTTP Request</strong> (HTTP požadavek) je digitální zpráva, kterou jeden počítač posílá druhému, aby od něj něco získal nebo mu něco předal. Je to základní stavební kámen komunikace na internetu.</p>
        <h3>Základní typy</h3>
        <ul>
          <li><strong>GET:</strong> Získání dat (např. načtení webové stránky)</li>
          <li><strong>POST:</strong> Odeslání dat (např. odeslání formuláře)</li>
          <li><strong>PUT/PATCH:</strong> Aktualizace existujících dat</li>
          <li><strong>DELETE:</strong> Smazání dat</li>
        </ul>
    en:
      title: "HTTP Request"
      description: "What is an HTTP request? A digital message that one computer sends to another to obtain or transfer data."
      short_definition: "A digital message that one computer sends to another to obtain or transfer data."
      text: |
        <h2>What is an HTTP request?</h2>
        <p>An <strong>HTTP request</strong> is a digital message that one computer sends to another to obtain something from it or transfer something to it. It is the fundamental building block of internet communication.</p>
        <h3>Basic types</h3>
        <ul>
          <li><strong>GET:</strong> Retrieve data (e.g., loading a web page)</li>
          <li><strong>POST:</strong> Send data (e.g., submitting a form)</li>
          <li><strong>PUT/PATCH:</strong> Update existing data</li>
          <li><strong>DELETE:</strong> Delete data</li>
        </ul>

