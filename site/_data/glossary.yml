        <h2>Co jsou metadata?</h2>
        <p><strong>Metadata</strong> jsou „data o datech". Jsou to doplňující informace, které AI model nevidí jako hlavní text, ale které systému pomáhají s organizací - například URL adresa zdroje, datum aktualizace nebo kategorie dokumentu.</p>
    en:
      title: "Metadata"
      description: "What is metadata? Supplementary information about data that helps systems with organization and context."
