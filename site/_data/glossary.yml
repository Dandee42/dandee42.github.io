        <ul>
          <li>Automatizace opakujících se úkolů mezi aplikacemi</li>
          <li>Tvorba AI <a href="/glossary/chatbot/">chatbotů</a> a agentů</li>
          <li>Zpracování dat a reporting</li>
          <li>Propojení systémů, které nemají nativní integraci</li>
        </ul>
    en:
      title: "n8n"
      description: "What is n8n? A low-code workflow automation platform that connects hundreds of apps without complex coding."
      short_definition: "A low-code workflow automation platform that connects hundreds of apps without complex coding."
      text: |
        <h2>What is n8n?</h2>
        <p><strong>n8n</strong> is an open-source <a href="/en/glossary/low-code-no-code/">low-code</a> <a href="/en/glossary/workflow/">workflow</a> automation platform. It allows you to visually connect hundreds of applications and services without complex coding.</p>
        <h3>Key features</h3>
        <ul>
          <li><strong>Visual editor:</strong> Drag-and-drop interface for building automations</li>
          <li><strong>400+ integrations:</strong> Connect with CRM, email, databases, <a href="/en/glossary/api/">APIs</a>, and more</li>
          <li><strong>Self-hosted:</strong> Run on your own server for full data control</li>
          <li><strong>AI integration:</strong> Native support for <a href="/en/glossary/llm/">LLM models</a>, <a href="/en/glossary/rag/">RAG</a>, and <a href="/en/glossary/agentni-systemy/">AI agents</a></li>
        </ul>
        <h3>When n8n is the right fit</h3>
        <ul>
          <li>Automating repetitive tasks between applications</li>
          <li>Building AI <a href="/en/glossary/chatbot/">chatbots</a> and agents</li>
          <li>Data processing and reporting</li>
          <li>Connecting systems that lack native integration</li>
        </ul>

- page_id: embedding-model
  type: glossary
  slug: embedding-model
  term: Embedding model
  categories: [rag, llm]
  date: 2026-04-21 +02:00
  published: true
  icon: transform
  lang:
    cs:
      title: "Embedding model"
      description: "Co je embedding model? Specializovaný typ AI, který převádí text na číselné vektory pro efektivní sémantické vyhledávání."
      short_definition: "Specializovaný typ AI, který převádí text na číselné vektory pro efektivní sémantické vyhledávání."
      text: |
        <h2>Co je embedding model?</h2>
        <p><strong>Embedding model</strong> je specializovaný typ umělé inteligence, který slouží jako překladač mezi lidskou řečí a světem čísel. Jeho úlohou je vzít kus textu (slovo, větu nebo odstavec) a vypočítat pro něj jeho vektor - číselnou reprezentaci významu.</p>
        <h3>Jak embedding model funguje</h3>
        <p>Moderní embedding modely pracují v prostoru o stovkách až tisících dimenzí. Například model od OpenAI (text-embedding-3-small) používá 1 536 dimenzí. Každý úsek textu tak dostane 1 536 souřadnic, které přesně definují jeho význam.</p>
        <h3>Využití v <a href="/glossary/rag/">RAG</a></h3>
        <ul>
          <li>Při ukládání se dokumenty převádějí na <a href="/glossary/vektor/">vektory</a> do <a href="/glossary/vektorova-databaze/">vektorové databáze</a></li>
          <li>Při dotazu se otázka uživatele převede na vektor pro porovnání s uloženými daty</li>
          <li>Umožňuje <a href="/glossary/semanticke-vyhledavani/">sémantické vyhledávání</a> - hledání podle významu, ne jen klíčových slov</li>
        </ul>
    en:
      title: "Embedding Model"
      description: "What is an embedding model? A specialized type of AI that converts text into numerical vectors for efficient semantic search."
      short_definition: "A specialized type of AI that converts text into numerical vectors for efficient semantic search."
      text: |
        <h2>What is an embedding model?</h2>
        <p>An <strong>embedding model</strong> is a specialized type of artificial intelligence that serves as a translator between human speech and the world of numbers. Its task is to take a piece of text (a word, sentence, or paragraph) and calculate its <a href="/en/glossary/vektor/">vector</a> - a numerical representation of meaning.</p>
        <h3>How embedding models work</h3>
        <p>Modern embedding models operate in a space with hundreds to thousands of dimensions. For example, the OpenAI model (text-embedding-3-small) uses 1,536 dimensions. Each section of text is assigned 1,536 coordinates that precisely define its meaning.</p>
        <h3>Use in <a href="/en/glossary/rag/">RAG</a></h3>
        <ul>
          <li>When storing, documents are converted to vectors in a <a href="/en/glossary/vektorova-databaze/">vector database</a></li>
          <li>When querying, the user's question is converted to a vector for comparison with stored data</li>
          <li>Enables <a href="/en/glossary/semanticke-vyhledavani/">semantic search</a> - searching by meaning, not just keywords</li>
        </ul>

- page_id: vektor
  type: glossary
  slug: vektor
  term: Vektor
  categories: [rag]
  date: 2026-04-21 +02:00
  published: true
  icon: scatter_plot
  lang:
    cs:
      title: "Vektor (v kontextu AI)"
      description: "Co je vektor v AI? Číselné vyjádření významu textu, které umožňuje strojům porovnávat informace podle jejich smyslu."
      short_definition: "Číselné vyjádření významu textu, které umožňuje strojům porovnávat informace podle jejich smyslu."
      text: |
        <h2>Co je vektor v kontextu AI?</h2>
        <p><strong>Vektor</strong> je v kontextu AI číselné vyjádření významu slova, věty nebo celého dokumentu. Protože počítače nerozumí textu tak jako lidé, používají k porovnávání informací dlouhé seznamy čísel (souřadnice).</p>
        <p>Tyto souřadnice určují přesnou polohu dané informace v pomyslném prostoru znalostí. Pokud mají dva texty podobný význam, leží jejich vektory v databázi blízko sebe.</p>
        <h3>Proč jsou vektory důležité</h3>
        <ul>
          <li>Umožňují <a href="/glossary/semanticke-vyhledavani/">sémantické vyhledávání</a> - hledání podle významu, ne jen podle klíčových slov</li>
          <li>Jsou základem <a href="/glossary/rag/">RAG systémů</a> a <a href="/glossary/vektorova-databaze/">vektorových databází</a></li>
          <li>Vytvářejí se pomocí <a href="/glossary/embedding-model/">embedding modelů</a></li>
        </ul>
    en:
      title: "Vector (in AI context)"
      description: "What is a vector in AI? A numerical representation of text meaning that allows machines to compare information by its sense."
      short_definition: "A numerical representation of text meaning that allows machines to compare information by its sense."
      text: |
        <h2>What is a vector in AI?</h2>
        <p>A <strong>vector</strong> in the context of AI is a numerical representation of the meaning of a word, sentence, or entire document. Because computers do not understand text the way humans do, they use long lists of numbers (coordinates) to compare information.</p>
        <p>These coordinates determine the exact position of the information in a hypothetical knowledge space. If two texts have similar meanings, their vectors lie close to each other in the database.</p>
        <h3>Why vectors matter</h3>
        <ul>
          <li>Enable <a href="/en/glossary/semanticke-vyhledavani/">semantic search</a> - searching by meaning, not just keywords</li>
          <li>Are the foundation of <a href="/en/glossary/rag/">RAG systems</a> and <a href="/en/glossary/vektorova-databaze/">vector databases</a></li>
          <li>Created using <a href="/en/glossary/embedding-model/">embedding models</a></li>
        </ul>

