      text: |
        <h2>Co je n8n?</h2>
        <p><strong>n8n</strong> je open-source <a href="/glossary/low-code-no-code/">low-code</a> platforma pro automatizaci <a href="/glossary/workflow/">workflow</a>. Umožňuje vizuálně propojovat stovky aplikací a služeb bez nutnosti složitého kódování.</p>
        <h3>Klíčové vlastnosti</h3>
        <ul>
          <li><strong>Vizuální editor:</strong> Drag-and-drop rozhraní pro tvorbu automatizací</li>
