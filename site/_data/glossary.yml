        <h2>Co je sitemap?</h2>
        <p><strong>Sitemap</strong> (mapa stránek) je soubor, nejčastěji ve formátu XML, který obsahuje seznam všech důležitých URL adres vašeho webu. Slouží primárně pro roboty vyhledávačů (Google, Seznam), kterým pomáhá efektivněji procházet a indexovat web.</p>
        <h3>Využití v automatizaci</h3>
        <p>V kontextu RAG systémů slouží sitemap jako výchozí bod pro automatické stahování obsahu webu do vektorové databáze.</p>
    en:
      title: "Sitemap"
      description: "What is a sitemap? A file containing a list of all important URLs on a website that helps search engines index pages more effectively."
      short_definition: "A file containing a list of all important URLs on a website that helps search engines index pages more effectively."
      text: |
        <h2>What is a sitemap?</h2>
        <p>A <strong>sitemap</strong> is a file, usually in XML format, that contains a list of all the important URLs on your website. It is primarily used by search engine robots (e.g., Google) to crawl and index your website more effectively.</p>
        <h3>Use in automation</h3>
        <p>In the context of RAG systems, a sitemap serves as a starting point for automatically downloading website content into a vector database.</p>

