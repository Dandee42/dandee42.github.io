      title: "Markdown"
      description: "Co je Markdown? Odlehčený značkovací jazyk pro úpravu prostého textu a jeho převod na formátovaný text pro web."
      short_definition: "Odlehčený značkovací jazyk pro úpravu prostého textu a jeho převod na formátovaný text pro web."
      text: |
        <h2>Co je Markdown?</h2>
        <p><strong>Markdown</strong> je odlehčený značkovací jazyk, který slouží pro úpravu prostého textu a jeho následný převod na formátovaný text publikovatelný na webu (HTML). Text je dobře čitelný i v původním formátu.</p>
        <h3>Využití v AI</h3>
        <p>AI modely lépe rozumí textu ve formátu Markdown než surovému <a href="/glossary/html/">HTML</a>, proto se při přípravě dat pro <a href="/glossary/rag/">RAG systémy</a> často převádí HTML obsah do Markdownu.</p>
    en:
      title: "Markdown"
      description: "What is Markdown? A lightweight markup language for editing plain text and converting it to formatted web content."
      short_definition: "A lightweight markup language for editing plain text and converting it to formatted web content."
      text: |
        <h2>What is Markdown?</h2>
        <p><strong>Markdown</strong> is a lightweight markup language used to edit plain text and convert it into formatted text that can be published on the web (HTML). The text is easy to read even in its original format.</p>
        <h3>Use in AI</h3>
        <p>AI models understand text in Markdown format better than raw <a href="/en/glossary/html/">HTML</a>, which is why HTML content is often converted to Markdown when preparing data for <a href="/en/glossary/rag/">RAG systems</a>.</p>

- page_id: chunking
  type: glossary
  slug: chunking
  term: Chunking
  categories: [rag]
  date: 2026-04-21 +02:00
  published: true
  icon: view_module
  lang:
    cs:
      title: "Chunking"
      description: "Co je chunking? Proces rozdělení dlouhého textu na menší, logické celky (chunky) pro efektivní zpracování v RAG systémech."
      short_definition: "Proces rozdělení dlouhého textu na menší, logické celky (chunky) pro efektivní zpracování v RAG systémech."
      text: |
        <h2>Co je chunking?</h2>
        <p><strong>Chunking</strong> je proces rozdělení dlouhého textu na menší, logické celky - tzv. chunky (kousky). Jde o klíčový krok při přípravě dat pro <a href="/glossary/rag/">RAG systémy</a>.</p>
        <h3>Proč je chunking důležitý</h3>
        <p><a href="/glossary/llm/">LLM modely</a> mají omezené <a href="/glossary/context-window/">kontextové okno</a>. Místo předhození celého dokumentu najednou se modelu předloží pouze relevantní kousky, čímž se šetří <a href="/glossary/token/">tokeny</a> a zvyšuje přesnost odpovědí.</p>
        <h3>Typické parametry</h3>
        <ul>
          <li><strong>Velikost chunku:</strong> 500–1 000 znaků</li>
          <li><strong>Překryv:</strong> 10–20 % - aby se neztratil kontext mezi sousedními chunky</li>
          <li><strong>Dělení:</strong> Podle odstavců, nadpisů nebo logických celků</li>
        </ul>
    en:
      title: "Chunking"
      description: "What is chunking? The process of dividing long text into smaller, logical units (chunks) for efficient processing in RAG systems."
      short_definition: "The process of dividing long text into smaller, logical units (chunks) for efficient processing in RAG systems."
      text: |
        <h2>What is chunking?</h2>
        <p><strong>Chunking</strong> is the process of dividing a long text into smaller, logical units - called chunks. It is a key step when preparing data for <a href="/en/glossary/rag/">RAG systems</a>.</p>
        <h3>Why chunking matters</h3>
        <p><a href="/en/glossary/llm/">LLM models</a> have a limited <a href="/en/glossary/context-window/">context window</a>. Instead of presenting the entire document at once, only relevant chunks are passed to the model, saving <a href="/en/glossary/token/">tokens</a> and increasing response accuracy.</p>
        <h3>Typical parameters</h3>
        <ul>
          <li><strong>Chunk size:</strong> 500–1,000 characters</li>
          <li><strong>Overlap:</strong> 10–20% - to maintain context between adjacent chunks</li>
          <li><strong>Splitting:</strong> By paragraphs, headings, or logical sections</li>
        </ul>

