        <h2>Co je Markdown?</h2>
        <p><strong>Markdown</strong> je odlehčený značkovací jazyk, který slouží pro úpravu prostého textu a jeho následný převod na formátovaný text publikovatelný na webu (HTML). Text je dobře čitelný i v původním formátu.</p>
        <h3>Využití v AI</h3>
