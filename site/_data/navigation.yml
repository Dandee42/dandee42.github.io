# Site navigation, shared by the header, the mobile menu and the footer (nav-links.html).
# Labels come from _data/<lang>/footer.yml (trans.footer.<key>), the URLs from _data/urls.yml in the
# page's language (polyglot adds /en to them in the English build).
#   key:    the label and the _data/urls.yml entry of the link
#   header: also shown in the header and the mobile menu (the footer lists every item)
#   match:  _data/urls.yml entries whose paths mark the item as the current page
#   exact:  current only on that exact URL
- key: home
  exact: true
  header: false
- key: services
  match: [services, use_cases]
  header: true
- key: blog
  match: [blog, tag]
  header: true
- key: glossary
  match: [glossary]
  header: false
- key: about
  match: [about]
  header: true
- key: contact
  match: [contact]
  header: true
