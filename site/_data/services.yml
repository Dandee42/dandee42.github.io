      text: |
        <h2>Development that keeps up with your ideas</h2>
        <p>Vibecoding is a development approach where AI tools take over the repetitive parts of coding while the developer directs architecture and business logic. The result is dramatically faster delivery - without sacrificing quality. Ideal for startups, internal tools, and MVPs.</p>
