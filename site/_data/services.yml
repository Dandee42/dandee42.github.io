      text: |
        <h2>Vaše data jako nejchytřejší kolega</h2>
        <p>RAG (Retrieval-Augmented Generation) je technika, která propojí velký jazykový model s vašimi vlastními daty. Výsledkem je AI, která odpovídá přesně a fakticky — nikoliv z obecných znalostí, ale přímo z vašich PDF, interních wiki, smluv nebo databází.</p>
        <h3>Kdy se RAG hodí:</h3>
        <ul>
          <li><strong>Interní znalostní báze:</strong> Zaměstnanci se ptají systému místo procházení stohu dokumentů.</li>
          <li><strong>Zákaznická podpora:</strong> Chatbot, který odpovídá z vašich manuálů a FAQ s přesností a zdrojem.</li>
          <li><strong>Analýza dokumentů:</strong> Rychlé hledání v právních smlouvách, technické dokumentaci nebo výzkumných zprávách.</li>
          <li><strong>Vektorové databáze:</strong> Implementace Qdrant, Chroma nebo Pinecone pro efektivní sémantické vyhledávání.</li>
        </ul>
      contact_link: "Chci AI nad svými daty"
    en:
      title: "RAG Systems — AI Over Your Data"
      description: "I build intelligent search and chatbots over your internal documents, databases, and knowledge base."
      lead: "Give your data a voice. Ask your company knowledge base like a person."
      text: |
        <h2>Your data as your smartest colleague</h2>
        <p>RAG (Retrieval-Augmented Generation) connects a large language model to your own data. The result is an AI that answers accurately and factually — not from general knowledge, but directly from your PDFs, internal wikis, contracts, or databases.</p>
