  lang:
    cs:
      title: "Tvorba webových aplikací na míru"
      description: "Interní systémy, klientské portály a MVP na míru. Rychlý vývoj s AI, automatické testy a napojení na vaše nástroje. Prototyp za 30 000 Kč."
      card_description: "Interní systémy, klientské portály a MVP na míru. Rychlý vývoj s AI, automatické testy a napojení na vaše nástroje."
      lead: "Když Excel a krabicové nástroje přestanou stačit, přichází na řadu aplikace na míru."
      text: |
        <h2>Aplikace, které se přizpůsobí vám, ne naopak</h2>
        <p>Firmy často vedou evidenci zakázek v Excelu, posílají si tabulky e-mailem a přepisují data mezi systémy. Krabicová řešení je zase nutí přizpůsobit procesy jejich logice. Webová aplikace na míru dělá přesně to, co potřebujete, a nic navíc.</p>
        <h2>Co pro vás mohu postavit</h2>
        <ul>
          <li><strong>Interní systémy a evidence:</strong> místo sdílených tabulek přehledná aplikace pro zakázky, klienty nebo sklad, s uživatelskými právy a historií změn.</li>
          <li><strong>Klientské portály:</strong> místo, kde vaši zákazníci najdou své objednávky, dokumenty nebo stav zakázky.</li>
          <li><strong>Dashboardy a reporty:</strong> data z více zdrojů na jednom místě, bez ručního exportování.</li>
          <li><strong>MVP a prototypy:</strong> první verze produktu, se kterou ověříte nápad na trhu.</li>
          <li><strong>Rozšíření existujících systémů:</strong> doplnění funkcí tam, kde krabicové řešení končí.</li>
        </ul>
        <h2>Jaký je rozdíl mezi webem a webovou aplikací?</h2>
        <p>Web vás prezentuje a návštěvník si ho přečte. Webová aplikace slouží k práci: uživatelé se přihlašují, zadávají a upravují data a aplikace s nimi dál pracuje, třeba počítá, třídí nebo posílá upozornění. Běží v prohlížeči, takže ji není potřeba instalovat a funguje na počítači i v mobilu.</p>
        <h2>Napojení na nástroje, které už používáte</h2>
        <p>Aplikace nemusí stát osamoceně. Díky zkušenostem s automatizací (n8n) a API ji propojím s nástroji, které už používáte, jako je fakturace, CRM, e-mail nebo tabulky, a data mezi nimi potečou automaticky. Kde to dává smysl, doplním i AI: třídění dokumentů, vytěžování dat nebo vyhledávání ve firemních dokumentech pomocí <a href="/services/rag-systems/">RAG</a>.</p>
        <h2>Rychlý vývoj s AI, spolehlivost díky testům</h2>
        <p>Aplikace stavím v Djangu (Python) nebo v Next.js, podle toho, co se pro váš projekt hodí víc, a při vývoji využívám AI nástroje jako Claude Code a Cursor. Rutinní část kódu díky tomu vzniká rychleji a vy dostanete funkční verzi dřív a levněji. Rychlost ale nesmí jít na úkor kvality, proto klíčové funkce pokrývám automatickými testy (Playwright), které hlídají, že aplikace funguje i po každé další úpravě.</p>
        <h2>Jak probíhá spolupráce</h2>
        <ol>
          <li><strong>Úvodní konzultace zdarma:</strong> probereme, jaký problém má aplikace řešit a kdo ji bude používat.</li>
          <li><strong>Placený prototyp za 30 000 Kč:</strong> uvidíte, jak bude aplikace fungovat, ještě než se rozhodnete pro celý projekt. Pokud budeme pokračovat, celá částka se započítá do ceny aplikace.</li>
          <li><strong>Vývoj po částech:</strong> aplikaci stavím postupně a průběžně ji s vámi ladím.</li>
          <li><strong>Testování a nasazení:</strong> automatické testy, spuštění do provozu a předání.</li>
          <li><strong>Podpora a rozvoj:</strong> první měsíc podpory je v ceně, potom měsíční paušál nebo hodinová sazba.</li>
        </ol>
        <h2>Kolik stojí webová aplikace na míru</h2>
        <p><strong>Prototyp za 30 000 Kč, webová aplikace od 80 000 Kč.</strong> Cena závisí na počtu funkcí, uživatelských rolí a napojení na další systémy. Po prototypu přesně víte, co dostanete a za kolik. Nejsem plátce DPH.</p>
        <h2>Časté otázky</h2>
        <h3>Jak dlouho vývoj trvá?</h3>
        <p>Záleží na rozsahu. Díky vývoji s AI bývá první funkční verze hotová dřív než při klasickém vývoji. Konkrétní termín dostanete po prototypu.</p>
        <h3>Musím mít přesné zadání?</h3>
        <p>Ne. Stačí popsat problém, který řešíte. Zadání společně upřesníme během konzultace a prototypu.</p>
        <h3>Napojíte aplikaci na naše systémy?</h3>
        <p>Pokud vaše systémy mají API nebo umožňují export dat, většinou ano. Možnosti napojení prověříme už při prototypu.</p>
        <h3>Komu patří zdrojový kód?</h3>
        <p>Vám. Po dokončení vám předám zdrojový kód i přístupy, takže aplikaci může v budoucnu rozvíjet kdokoli.</p>
        <h3>Kolik stojí provoz a údržba?</h3>
        <p>Provoz zahrnuje hosting a údržbu aplikace. Péči můžete mít v měsíčním paušálu, nebo platit jen za úpravy, které si objednáte.</p>
      contact_link: "Poptat vývoj"
    en:
      title: "Custom Web App Development"
      description: "Custom internal systems, client portals and MVPs. Fast AI-assisted development, automated tests and integrations with your tools. Prototype for CZK 30,000."
      card_description: "Custom internal systems, client portals and MVPs. Fast AI-assisted development, automated tests and integrations with your tools."
      lead: "When spreadsheets and off-the-shelf tools stop being enough, it's time for a custom app."
      text: |
        <h2>Apps that adapt to you, not the other way around</h2>
        <p>Companies often track orders in Excel, email spreadsheets back and forth and retype data between systems. Off-the-shelf software, on the other hand, forces them to adapt their processes to its logic. A custom web app does exactly what you need and nothing more.</p>
        <h2>What I can build for you</h2>
        <ul>
          <li><strong>Internal systems and records:</strong> instead of shared spreadsheets, a clear app for orders, clients or stock, with user permissions and change history.</li>
          <li><strong>Client portals:</strong> a place where your customers find their orders, documents or the status of their project.</li>
          <li><strong>Dashboards and reports:</strong> data from multiple sources in one place, without manual exports.</li>
          <li><strong>MVPs and prototypes:</strong> a first version of your product to test the idea on the market.</li>
          <li><strong>Extensions to existing systems:</strong> adding features where off-the-shelf software stops.</li>
        </ul>
        <h2>What's the difference between a website and a web app?</h2>
        <p>A website presents you, and visitors read it. A web app is for getting work done: users log in, enter and edit data, and the app works with it, for example by calculating, sorting or sending notifications. It runs in the browser, so there's nothing to install and it works on desktops and phones.</p>
        <h2>Connected to the tools you already use</h2>
        <p>An app doesn't have to stand alone. With my experience in automation (n8n) and APIs, I'll connect it to the tools you already use, such as invoicing, your CRM, email or spreadsheets, so data flows between them automatically. Where it makes sense, I'll add AI too: sorting documents, extracting data or searching company documents with <a href="/en/services/rag-systems/">RAG</a>.</p>
        <h2>Fast AI-assisted development, reliable thanks to tests</h2>
        <p>I build apps in Django (Python) or Next.js, depending on what suits your project better, and use AI tools such as Claude Code and Cursor during development. The routine parts of the code get written faster, so you get a working version sooner and for less. Speed must not come at the expense of quality, so I cover key features with automated tests (Playwright) that check the app still works after every change.</p>
        <h2>How we'll work together</h2>
        <ol>
          <li><strong>Free initial consultation:</strong> we'll discuss what problem the app should solve and who will use it.</li>
          <li><strong>Paid prototype for CZK 30,000:</strong> you'll see how the app will work before you commit to the whole project. If we continue, the full amount counts towards the price of the app.</li>
          <li><strong>Development in stages:</strong> I build the app step by step and fine-tune it with you along the way.</li>
          <li><strong>Testing and deployment:</strong> automated tests, going live and handover.</li>
          <li><strong>Support and further development:</strong> the first month of support is included, then a monthly care plan or an hourly rate.</li>
        </ol>
        <h2>How much does a custom web app cost?</h2>
        <p><strong>Prototype for CZK 30,000, web apps from CZK 80,000.</strong> The price depends on the number of features, user roles and integrations with other systems. After the prototype you'll know exactly what you'll get and for how much. I'm not registered for VAT, so no VAT is added.</p>
        <h2>Frequently asked questions</h2>
        <h3>How long does development take?</h3>
        <p>It depends on the scope. Thanks to AI-assisted development, the first working version is usually ready sooner than with traditional development. You'll get a specific timeline after the prototype.</p>
        <h3>Do I need a detailed specification?</h3>
        <p>No. It's enough to describe the problem you're solving. We'll refine the requirements together during the consultation and the prototype.</p>
        <h3>Can you connect the app to our systems?</h3>
        <p>If your systems have an API or allow data export, usually yes. We'll check the integration options during the prototype.</p>
        <h3>Who owns the source code?</h3>
        <p>You do. When the project is finished, I'll hand over the source code and all access, so anyone can develop the app further.</p>
        <h3>What do hosting and maintenance cost?</h3>
        <p>Running the app includes hosting and maintenance. You can have it looked after through a monthly care plan, or pay only for the changes you order.</p>
      contact_link: "Get a quote"

