      card_description: "Landing page pro vaši kampaň s měřením konverzí a poptávkami rovnou do CRM. Jednostránkový web, který přivádí zákazníky."
      lead: "Jedna stránka, jeden cíl: proměnit návštěvníky z kampaně v zákazníky."
      text: |
        <h2>Co je landing page a kdy ji potřebujete</h2>
        <p>Landing page (vstupní stránka) je jednostránkový web zaměřený na jediný cíl: poptávku, registraci, rezervaci nebo stažení. Na rozdíl od běžného webu nenabízí menu s desítkami odkazů, ale vede návštěvníka přímo k akci.</p>
        <p>Landing page se hodí, když:</p>
        <ul>
          <li>spouštíte kampaň na Google Ads, Skliku nebo sociálních sítích,</li>
          <li>uvádíte novou službu nebo produkt,</li>
          <li>sbíráte registrace na akci, webinář nebo konzultaci,</li>
          <li>chcete rychle ověřit, jestli o vaši nabídku je zájem,</li>
          <li>vám místo velkého webu stačí jednoduchý jednostránkový web.</li>
        </ul>
        <h2>Landing page, kterou můžete měřit</h2>
        <p>Z online marketingu vím, že landing page bez měření je jen hezký obrázek. Každou stránku proto připravím tak, abyste věděli, kolik vás stojí jedna poptávka:</p>
        <ul>
          <li>měření konverzí v Google Analytics 4,</li>
          <li>připravenost na reklamní kampaně (UTM parametry, cíle),</li>
          <li>rychlé načítání, protože každá sekunda navíc snižuje počet poptávek,</li>
          <li>srozumitelná struktura: problém, řešení, důvěra a výzva k akci.</li>
        </ul>
        <h2>Poptávky rovnou do CRM</h2>
        <p>Formulář na landing page napojím pomocí automatizace (n8n) tam, kde poptávky potřebujete: do CRM, tabulky nebo e-mailu. Zákazník dostane okamžitou odpověď a vy upozornění, takže žádný kontakt z placené kampaně nezapadne.</p>
        <h2>Co dostanete</h2>
        <ul>
          <li>jednostránkový web na míru vaší kampani,</li>
          <li>zobrazení na mobilu i počítači, protože velká část návštěv z reklam přichází z telefonu,</li>
          <li>základní SEO a náhled pro sdílení na sociálních sítích,</li>
          <li>měření konverzí,</li>
          <li>napojení formuláře na vaše nástroje,</li>
          <li>kontrolu, že formulář funguje, ještě než spustíte kampaň.</li>
        </ul>
        <h2>Jak probíhá tvorba landing page</h2>
        <ol>
          <li><strong>Konzultace zdarma:</strong> cíl kampaně, cílová skupina a vaše nabídka.</li>
          <li><strong>Struktura a texty:</strong> návrh sekcí a hlavních sdělení.</li>
          <li><strong>Vývoj a napojení:</strong> stránka, měření a formulář.</li>
          <li><strong>Test a spuštění:</strong> kontrola na mobilu i počítači, test formuláře a spuštění.</li>
        </ol>
        <h2>Kolik stojí landing page</h2>
        <p><strong>Landing page od 7 900 Kč.</strong> Cena závisí na počtu sekcí, jazykových verzích a napojení na další systémy. Po konzultaci dostanete cenovou nabídku. Nejsem plátce DPH.</p>
        <p>První měsíc po spuštění jsou drobné úpravy v ceně. Potom si můžete vybrat měsíční paušál, nebo platit jen jednotlivé úpravy podle hodinové sazby.</p>
        <p>Potřebujete víc než jednu stránku? Podívejte se na <a href="/services/website-development/">tvorbu webových stránek na míru</a>.</p>
        <h2>Časté otázky</h2>
        <h3>Jaký je rozdíl mezi landing page a webem?</h3>
        <p>Web vás představuje jako celek a návštěvník si na něm vybírá, kam půjde dál. Landing page má jeden cíl a všechno na ní vede k jedné akci, proto u kampaní obvykle přinese víc poptávek.</p>
        <h3>Je landing page dobrá pro SEO?</h3>
        <p>Landing page je postavená hlavně pro kampaně. Na konkrétní dotaz se ve vyhledávání najít může, ale pro dlouhodobé SEO je lepší web s více stránkami a pravidelným obsahem.</p>
        <h3>Jak rychle bude landing page hotová?</h3>
        <p>Díky menšímu rozsahu je landing page nejrychlejší způsob, jak mít novou nabídku online. Konkrétní termín dostanete v nabídce po konzultaci.</p>
        <h3>Můžu landing page později rozšířit na celý web?</h3>
        <p>Ano. Landing page může být základem budoucího webu a další stránky k ní přidáme, až je budete potřebovat.</p>
      contact_link: "Chci landing page"
    en:
      title: "Landing Page Development"
      description: "A landing page for your campaign with conversion tracking and enquiries sent straight to your CRM. A one-page site that brings customers. From CZK 7,900."
      card_description: "A landing page for your campaign with conversion tracking and enquiries sent straight to your CRM. A one-page site that brings customers."
      lead: "One page, one goal: turning campaign visitors into customers."
      text: |
        <h2>What a landing page is and when you need one</h2>
        <p>A landing page is a one-page website focused on a single goal: an enquiry, a sign-up, a booking or a download. Unlike a regular website, it doesn't offer a menu with dozens of links; it leads visitors straight to action.</p>
        <p>A landing page is a good fit when you:</p>
        <ul>
          <li>launch a campaign on Google Ads, Sklik or social media,</li>
          <li>introduce a new service or product,</li>
          <li>collect sign-ups for an event, a webinar or a consultation,</li>
          <li>want to quickly test whether there's demand for your offer,</li>
          <li>need a simple one-page site instead of a full website.</li>
        </ul>
        <h2>A landing page you can measure</h2>
        <p>My background in online marketing taught me that a landing page without tracking is just a pretty picture. I build every page so you know what each enquiry costs you:</p>
        <ul>
          <li>conversion tracking in Google Analytics 4,</li>
          <li>ready for ad campaigns (UTM parameters, goals),</li>
          <li>fast loading, because every extra second costs you enquiries,</li>
          <li>a clear structure: problem, solution, trust and a call to action.</li>
        </ul>
        <h2>Enquiries straight to your CRM</h2>
        <p>I connect the landing page form through automation (n8n) to wherever you need your enquiries: a CRM, a spreadsheet or your inbox. The customer gets an instant reply and you get a notification, so no lead from a paid campaign slips through the cracks.</p>
        <h2>What you get</h2>
        <ul>
          <li>a one-page website tailored to your campaign,</li>
          <li>a layout that works on phones and desktops, since much of ad traffic comes from phones,</li>
          <li>SEO basics and a preview for sharing on social media,</li>
          <li>conversion tracking,</li>
          <li>the form connected to your tools,</li>
          <li>a check that the form works before you launch the campaign.</li>
        </ul>
        <h2>How a landing page gets built</h2>
        <ol>
          <li><strong>Free consultation:</strong> the campaign goal, the target audience and your offer.</li>
          <li><strong>Structure and copy:</strong> a plan for the sections and the key messages.</li>
          <li><strong>Development and integrations:</strong> the page, tracking and the form.</li>
          <li><strong>Testing and launch:</strong> a check on phone and desktop, a form test and the launch.</li>
        </ol>
        <h2>How much does a landing page cost?</h2>
        <p><strong>Landing pages from CZK 7,900.</strong> The price depends on the number of sections, language versions and integrations with other systems. After the consultation you'll get a quote. I'm not registered for VAT, so no VAT is added.</p>
        <p>Small edits are included for the first month after launch. After that you can choose a monthly care plan or pay only for individual changes at an hourly rate.</p>
        <p>Need more than one page? Have a look at <a href="/en/services/website-development/">custom website development</a>.</p>
        <h2>Frequently asked questions</h2>
        <h3>What's the difference between a landing page and a website?</h3>
        <p>A website presents you as a whole, and visitors choose where to go next. A landing page has a single goal and everything on it leads to one action, which is why it usually brings more enquiries from campaigns.</p>
        <h3>Is a landing page good for SEO?</h3>
        <p>A landing page is built mainly for campaigns. It can rank for a specific query, but for long-term SEO a website with more pages and regular content works better.</p>
        <h3>How quickly will the landing page be ready?</h3>
        <p>Because of its smaller scope, a landing page is the fastest way to get a new offer online. You'll get a specific timeline in the quote after the consultation.</p>
        <h3>Can I extend the landing page into a full website later?</h3>
        <p>Yes. A landing page can be the foundation of a future website, and we'll add more pages when you need them.</p>
      contact_link: "I want a landing page"

