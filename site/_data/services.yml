      title: "Tvorba webových stránek na míru"
      description: "Prezentační weby na míru, které se rychle načtou, dobře se najdou a poptávky vám samy doručí do e-mailu nebo CRM. Od 24 900 Kč."
      card_description: "Prezentační weby na míru, které se rychle načtou, dobře se najdou a poptávky vám samy doručí do e-mailu nebo CRM."
      lead: "Web, který pro vás pracuje, i když vy zrovna ne."
      text: |
        <h2>Web, který nekončí u vizitky</h2>
        <p>Většina webů malých firem vypadá hezky, ale tím jejich práce končí. Poptávka zapadne v e-mailu, nikdo neví, odkud návštěvníci přišli, a po roce se web načítá pomalu kvůli desítkám pluginů. Stavím prezentační weby na míru, které jsou rychlé, dobře se najdou ve vyhledávání a hlavně jsou napojené na to, jak pracujete.</p>
        <p>Do IT jsem přišel z online marketingu a e-commerce. Web proto neberu jen jako kód, ale jako nástroj, který vám má přivádět zákazníky.</p>
        <h2>Pro koho je tvorba webu na míru</h2>
        <ul>
          <li><strong>Živnostníci a konzultanti,</strong> kteří potřebují důvěryhodnou prezentaci a pravidelné poptávky.</li>
          <li><strong>Malé firmy a služby,</strong> které chtějí web propojit s CRM, kalendářem nebo tabulkami.</li>
          <li><strong>Firmy se zahraničními klienty,</strong> které potřebují web v češtině i angličtině.</li>
          <li><strong>Všichni, komu přestal stačit web ze šablony</strong> – je pomalý, špatně se upravuje nebo ho nikdo nenajde.</li>
        </ul>
        <h2>Co dostanete</h2>
        <ul>
          <li><strong>Struktura a obsah podle vašich zákazníků:</strong> web postavený kolem toho, co návštěvníci hledají a co mají udělat.</li>
          <li><strong>SEO základ:</strong> struktura nadpisů, metadata, sitemap, strukturovaná data a čisté URL, aby vás Google i Seznam správně pochopily.</li>
          <li><strong>Zobrazení na všech zařízeních:</strong> mobil, tablet i počítač.</li>
          <li><strong>Vícejazyčnost:</strong> web v češtině i angličtině včetně správného nastavení pro vyhledávače.</li>
          <li><strong>Měření návštěvnosti:</strong> Google Analytics 4 s lištou pro souhlas s cookies.</li>
          <li><strong>Formuláře napojené na vaše procesy:</strong> viz další sekce.</li>
        </ul>
        <h2>Poptávky, které se zpracují samy</h2>
        <p>V tom se můj web liší od běžného webu. Protože se věnuji automatizaci procesů (n8n), může váš web s poptávkami rovnou pracovat:</p>
        <ul>
          <li>zápis poptávky do CRM, Google Sheets nebo jiné tabulky,</li>
          <li>automatická potvrzovací odpověď zákazníkovi,</li>
          <li>okamžité upozornění e-mailem nebo do chatu,</li>
          <li>třídění poptávek pomocí AI podle typu nebo naléhavosti,</li>
          <li>připomenutí, když na poptávku nikdo neodpoví.</li>
        </ul>
        <p>Víc o propojování systémů najdete u služby <a href="/services/intelligent-automation/">Inteligentní automatizace</a>.</p>
        <h2>Otestovaný web, který nepřestane fungovat</h2>
        <p>Formulář, který potichu přestane odesílat, stojí zakázky a nikdo si toho nevšimne. Věnuji se i automatizovanému testování (Playwright), takže klíčové části webu, jako jsou formuláře a rezervace, můžu pokrýt automatickými testy, které hlídají, že fungují i po každé úpravě.</p>
        <h2>Proč statický web na míru</h2>
        <p>Weby nestavím na WordPressu ani na šablonách z webových builderů, ale jako rychlé statické weby na míru:</p>
        <ul>
          <li><strong>Rychlost:</strong> stránky jsou připravené předem, takže se načítají okamžitě.</li>
          <li><strong>Bezpečnost:</strong> web nemá databázi ani pluginy, které je potřeba neustále aktualizovat a které bývají nejčastějším cílem útoků.</li>
          <li><strong>Nízké náklady na provoz:</strong> hosting statického webu je výrazně levnější.</li>
          <li><strong>Úpravy obsahu:</strong> web doplním o jednoduchý editor, ve kterém si texty a obrázky upravíte sami. Větší změny za vás udělám v rámci paušálu nebo podle hodinové sazby.</li>
        </ul>
        <h2>Jak probíhá spolupráce</h2>
        <ol>
          <li><strong>Úvodní konzultace zdarma:</strong> probereme vaše služby, zákazníky a co má web přinášet.</li>
          <li><strong>Návrh struktury a obsahu:</strong> připravím strukturu stránek a doporučení k textům.</li>
          <li><strong>Vývoj webu:</strong> rozpracovanou verzi uvidíte průběžně a můžete ji připomínkovat.</li>
          <li><strong>Napojení a testování:</strong> formuláře, měření návštěvnosti a automatizace.</li>
          <li><strong>Spuštění a podpora:</strong> web spustím na vaší doméně a první měsíc po spuštění jsou opravy a drobné úpravy v ceně.</li>
        </ol>
        <h2>Kolik stojí tvorba webu na míru</h2>
        <p><strong>Prezentační web od 24 900 Kč.</strong> Výsledná cena závisí na počtu stránek, jazykových verzích a napojení na další systémy. Po konzultaci dostanete cenovou nabídku. Nejsem plátce DPH.</p>
        <p>Po spuštění si můžete vybrat <strong>měsíční paušál</strong> (hosting, údržba, zálohy a drobné úpravy), nebo platit jen <strong>jednotlivé úpravy podle hodinové sazby</strong>.</p>
        <p>Potřebujete jen jednu stránku pro kampaň? Podívejte se na <a href="/services/landing-pages/">tvorbu landing page</a>.</p>
        <h2>Časté otázky</h2>
        <h3>Jak dlouho tvorba webu trvá?</h3>
        <p>Záleží na rozsahu a na tom, jak rychle se podaří připravit texty a podklady. Konkrétní termín dostanete v nabídce po úvodní konzultaci.</p>
        <h3>Budu si moct web upravovat sám?</h3>
        <p>Ano. Web doplním o jednoduchý editor, ve kterém si texty a obrázky upravíte sami, bez znalosti programování. Větší změny, jako jsou nové sekce nebo funkce, za vás udělám v rámci paušálu nebo podle hodinové sazby.</p>
        <h3>Komu bude web patřit?</h3>
        <p>Vám. Doména i obsah jsou vaše a po dokončení vám předám všechny přístupy.</p>
        <h3>Kolik budu platit za provoz?</h3>
        <p>Statický web má nízké náklady na hosting. Péči o web můžete mít v měsíčním paušálu, nebo platit jen za úpravy, které si objednáte.</p>
        <h3>Co od vás budu potřebovat?</h3>
        <p>Informace o vašich službách, logo, fotografie a podklady k textům. Se strukturou obsahu vám pomůžu.</p>
        <h3>Už web mám. Můžete ho předělat?</h3>
        <p>Ano. Projdu současný web a nový postavím tak, aby nepřišel o pozice ve vyhledávání, například přesměrováním starých adres.</p>
        <h3>Jaký je rozdíl mezi webem a landing page?</h3>
        <p>Web vás představuje jako celek a má více stránek. <a href="/services/landing-pages/">Landing page</a> je jedna stránka s jediným cílem, nejčastěji pro reklamní kampaň.</p>
        <h3>Postavíte i e-shop?</h3>
        <p>Ne. Zaměřuji se na prezentační weby, landing pages a <a href="/services/web-app-development/">webové aplikace na míru</a>.</p>
      contact_link: "Chci nový web"
    en:
      title: "Custom Website Development"
      description: "Custom business websites that load fast, rank well and deliver enquiries straight to your inbox or CRM. From CZK 24,900."
      card_description: "Custom business websites that load fast, rank well and deliver enquiries straight to your inbox or CRM."
      lead: "A website that works for you, even when you don't."
      text: |
        <h2>A website that's more than a business card</h2>
        <p>Most small business websites look nice, but that's where their job ends. Enquiries get lost in an inbox, nobody knows where visitors came from, and after a year the site is slow because of dozens of plugins. I build custom business websites that are fast, easy to find in search and, above all, connected to the way you work.</p>
        <p>I came to IT from online marketing and e-commerce, so I don't see a website as just code, but as a tool that should bring you customers.</p>
        <h2>Who a custom website is for</h2>
        <ul>
          <li><strong>Freelancers and consultants</strong> who need a trustworthy presentation and a steady flow of enquiries.</li>
          <li><strong>Small businesses and service providers</strong> who want their website connected to a CRM, calendar or spreadsheets.</li>
          <li><strong>Companies with international clients</strong> who need a website in Czech and English.</li>
          <li><strong>Anyone who has outgrown a template website</strong> because it's slow, hard to edit or nobody finds it.</li>
        </ul>
        <h2>What you get</h2>
        <ul>
          <li><strong>Structure and content built around your customers:</strong> a website shaped by what visitors are looking for and what they should do next.</li>
          <li><strong>SEO foundations:</strong> heading structure, metadata, sitemap, structured data and clean URLs, so search engines understand your site.</li>
          <li><strong>Works on every device:</strong> phone, tablet and desktop.</li>
          <li><strong>Multiple languages:</strong> a website in Czech and English, set up correctly for search engines.</li>
          <li><strong>Traffic analytics:</strong> Google Analytics 4 with a cookie consent banner.</li>
          <li><strong>Forms connected to your processes:</strong> see the next section.</li>
        </ul>
        <h2>Enquiries that handle themselves</h2>
        <p>This is where my websites differ from the usual ones. Because I specialise in process automation (n8n), your website can work with enquiries straight away:</p>
        <ul>
          <li>saving each enquiry to your CRM, Google Sheets or another spreadsheet,</li>
          <li>sending the customer an automatic confirmation,</li>
          <li>notifying you instantly by email or chat,</li>
          <li>sorting enquiries with AI by type or urgency,</li>
          <li>reminding you when an enquiry hasn't been answered.</li>
        </ul>
        <p>Find out more about connecting systems under <a href="/en/services/intelligent-automation/">Intelligent Automation</a>.</p>
        <h2>A tested website that keeps working</h2>
        <p>A form that silently stops sending costs you business, and nobody notices. I also do automated testing (Playwright), so key parts of your website, such as forms and bookings, can be covered by automated tests that check they still work after every change.</p>
        <h2>Why a custom static website</h2>
        <p>I don't build websites on WordPress or on website-builder templates. I build fast, custom static websites:</p>
        <ul>
          <li><strong>Speed:</strong> pages are prepared in advance, so they load instantly.</li>
          <li><strong>Security:</strong> there's no database and no plugins that need constant updates and are the most common target of attacks.</li>
          <li><strong>Low running costs:</strong> hosting a static website is much cheaper.</li>
          <li><strong>Content editing:</strong> I'll add a simple editor where you can change text and images yourself. I'll handle bigger changes through a care plan or at an hourly rate.</li>
        </ul>
        <h2>How we'll work together</h2>
        <ol>
          <li><strong>Free initial consultation:</strong> we'll talk about your services, your customers and what the website should achieve.</li>
          <li><strong>Structure and content plan:</strong> I'll prepare the page structure and recommendations for the copy.</li>
          <li><strong>Development:</strong> you'll see the work in progress and can comment along the way.</li>
          <li><strong>Integrations and testing:</strong> forms, analytics and automations.</li>
          <li><strong>Launch and support:</strong> I'll launch the website on your domain, and fixes and small edits are included for the first month.</li>
        </ol>
        <h2>How much does a custom website cost?</h2>
        <p><strong>Business websites from CZK 24,900.</strong> The final price depends on the number of pages, language versions and integrations with other systems. After the consultation you'll get a quote. I'm not registered for VAT, so no VAT is added.</p>
        <p>After launch you can choose a <strong>monthly care plan</strong> (hosting, maintenance, backups and small edits) or pay only for <strong>individual changes at an hourly rate</strong>.</p>
        <p>Need just one page for a campaign? Have a look at <a href="/en/services/landing-pages/">landing page development</a>.</p>
        <h2>Frequently asked questions</h2>
        <h3>How long does it take to build a website?</h3>
        <p>It depends on the scope and on how quickly the copy and materials are ready. You'll get a specific timeline in the quote after the initial consultation.</p>
        <h3>Will I be able to edit the website myself?</h3>
        <p>Yes. I'll add a simple editor where you can change text and images yourself, no coding needed. I'll handle bigger changes, such as new sections or features, through a care plan or at an hourly rate.</p>
        <h3>Who will own the website?</h3>
        <p>You will. The domain and the content are yours, and I'll hand over all access when the project is finished.</p>
        <h3>What will the running costs be?</h3>
        <p>A static website has low hosting costs. You can have the website looked after through a monthly care plan, or pay only for the changes you order.</p>
        <h3>What will you need from me?</h3>
        <p>Information about your services, your logo, photos and material for the copy. I'll help you with the content structure.</p>
        <h3>I already have a website. Can you rebuild it?</h3>
        <p>Yes. I'll review your current website and build the new one so that it keeps its search rankings, for example by redirecting old URLs.</p>
        <h3>What's the difference between a website and a landing page?</h3>
        <p>A website presents you as a whole and has multiple pages. A <a href="/en/services/landing-pages/">landing page</a> is a single page with a single goal, usually for an ad campaign.</p>
        <h3>Do you build online shops?</h3>
        <p>No. I focus on business websites, landing pages and <a href="/en/services/web-app-development/">custom web apps</a>.</p>
      contact_link: "I want a new website"

