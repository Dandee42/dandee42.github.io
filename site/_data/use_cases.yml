          <li><strong>Návrh odpovědi:</strong> AI připraví draft odpovědi na základě kontextu a vašich pravidel.</li>
          <li><strong>Vytvoření úkolu:</strong> Z e-mailu automaticky vznikne úkol v Notion, Jira nebo jiném nástroji.</li>
          <li><strong>Notifikace na Slack:</strong> Důležité e-maily okamžitě přeposlány do správného kanálu.</li>
