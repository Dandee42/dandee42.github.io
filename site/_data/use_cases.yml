        <p>The average worker spends over an hour a day on emails. Much of that is sorting, forwarding, and replying to routine messages. An AI agent can dramatically reduce this time — automatically recognizing message type, assigning priority, and preparing a reply draft.</p>
        <h3>What the AI agent handles:</h3>
        <ul>
          <li><strong>Email classification:</strong> Inquiry, complaint, spam, invoice, internal — automatically.</li>
          <li><strong>Priority assignment:</strong> Urgent messages flagged and surfaced first.</li>
