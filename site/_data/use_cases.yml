        <h2>Podpora, která nikdy nespí a nikdy neodpovídá špatně</h2>
        <p>Generické chatboty odpoví cokoliv — správně nebo ne. Chatbot postavený na RAG (Retrieval-Augmented Generation) čerpá výhradně z vašich dat: produktových manuálů, FAQ, obchodních podmínek a historie zákazníka. Výsledek je přesná odpověď s odkazem na zdroj.</p>
        <h3>Co chatbot umí:</h3>
        <ul>
          <li><strong>Odpovídat z vašich dokumentů:</strong> PDF manuály, FAQ stránky, znalostní báze.</li>
          <li><strong>Pracovat s historií zákazníka:</strong> Stav objednávky, reklamace, předchozí komunikace.</li>
          <li><strong>Eskalovat na člověka:</strong> Pokud si neví rady, předá konverzaci živému operátorovi.</li>
          <li><strong>Vícejazyčný provoz:</strong> Zákazník píše česky, anglicky nebo slovensky — chatbot rozumí.</li>
          <li><strong>Integrace na web nebo Slack:</strong> Nasazení tam, kde vaši zákazníci nebo tým už jsou.</li>
        </ul>
      contact_link: "Chci chatbot pro podporu"
    en:
      title: "AI Chatbot for Customer Support"
      description: "A chatbot that answers from your real data — manuals, FAQ, and order history. No hallucinations, with precise sources."
      lead: "Customer support that works 24/7 and answers accurately from your own data."
      text: |
        <h2>Support that never sleeps and never answers incorrectly</h2>
        <p>Generic chatbots will answer anything — right or wrong. A chatbot built on RAG (Retrieval-Augmented Generation) draws exclusively from your data: product manuals, FAQ, terms of service, and customer history. The result is a precise answer with a source reference.</p>
        <h3>What the chatbot can do:</h3>
        <ul>
          <li><strong>Answer from your documents:</strong> PDF manuals, FAQ pages, knowledge bases.</li>
          <li><strong>Work with customer history:</strong> Order status, complaints, previous communication.</li>
          <li><strong>Escalate to a human:</strong> If it can't help, it hands off the conversation to a live agent.</li>
          <li><strong>Multilingual support:</strong> Customers write in any language — the chatbot understands.</li>
          <li><strong>Web or Slack integration:</strong> Deployed where your customers or team already are.</li>
        </ul>
