      text: |
        <h2>Faktury, které se zpracují samy</h2>
        <p>Příchozí faktury v PDF, e-mailu nebo datové schránce — ruční zpracování je pomalé, náchylné k chybám a zbytečně drahé. Pomocí kombinace OCR, AI extrakce dat a automatizačních nástrojů (n8n) vytvořím systém, který faktury přijme, přečte, ověří a zapíše do vašeho účetnictví bez lidského zásahu.</p>
        <h3>Co systém zvládne:</h3>
        <ul>
          <li><strong>Příjem faktur:</strong> Z e-mailu, datové schránky nebo sdíleného úložiště.</li>
          <li><strong>Extrakce dat pomocí AI:</strong> Číslo faktury, dodavatel, částka, datum splatnosti — bez ručního přepisování.</li>
          <li><strong>Ověření a párování:</strong> Porovnání s objednávkami nebo dodavateli v CRM.</li>
          <li><strong>Zápis do účetnictví:</strong> Integrace s Pohodou, Money S3, Fakturoid, iDoklad nebo jiným systémem.</li>
          <li><strong>Notifikace výjimek:</strong> Pokud něco nesedí, dostanete upozornění — jinak běží vše automaticky.</li>
        </ul>
      contact_link: "Chci automatizovat faktury"
    en:
      title: "Invoice Processing Automation"
      description: "Stop manually entering invoices. Using AI and automation, I process incoming invoices, verify data, and write them to your accounting system."
      lead: "No more manual invoice entry — AI handles it faster and without errors."
      text: |
        <h2>Invoices that process themselves</h2>
        <p>Incoming invoices via PDF, email, or postal inbox — manual processing is slow, error-prone, and unnecessarily expensive. Using a combination of OCR, AI data extraction, and automation tools (n8n), I build a system that receives, reads, verifies, and records invoices into your accounting system without human intervention.</p>
        <h3>What the system handles:</h3>
        <ul>
          <li><strong>Invoice ingestion:</strong> From email, data mailbox, or shared storage.</li>
          <li><strong>AI data extraction:</strong> Invoice number, supplier, amount, due date — no manual typing.</li>
          <li><strong>Verification and matching:</strong> Cross-referencing with orders or suppliers in CRM.</li>
          <li><strong>Accounting integration:</strong> Connecting to your accounting system (QuickBooks, Xero, Fakturoid, etc.).</li>
          <li><strong>Exception alerts:</strong> If something doesn't match, you get notified — otherwise everything runs automatically.</li>
        </ul>
      contact_link: "Automate my invoices"

