        <ul>
          <li><strong>Napojení na dokumenty:</strong> SharePoint, Confluence, Google Drive, Notion nebo PDF složka.</li>
          <li><strong>Přesné odpovědi se zdrojem:</strong> Neodpovídá obecně — cituje konkrétní dokument a stránku.</li>
          <li><strong>Aktualizace v reálném čase:</strong> Změníte dokument — chatbot to ví automaticky.</li>
          <li><strong>Přístupová práva:</strong> Různé skupiny zaměstnanců vidí jen dokumenty, ke kterým mají přístup.</li>
          <li><strong>Integrace do Slacku nebo Teams:</strong> Dotaz přímo v nástroji, který tým používá.</li>
