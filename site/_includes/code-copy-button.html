{% assign lang = page.lang | default: site.default_lang %}
{% assign trans = site.data[site.active_lang] %}

<script defer>
document.querySelectorAll('pre').forEach(pre => {
  const button = document.createElement('button');
  button.className = 'copy-btn';

  button.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
  button.setAttribute('aria-label', '{{ trans.blog.code_copy_button | escape }}');

  pre.appendChild(button);

  button.addEventListener('click', () => {
    const code = pre.querySelector('code');
    if (!code) return;

    navigator.clipboard.writeText(code.textContent).then(() => {
      button.innerHTML = '<span class="material-symbols-outlined">check</span> {{ trans.blog.code_copied_button | escape }}';
      
      setTimeout(() => {
        button.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
      }, 1500);
    }).catch(err => console.error('{{ trans.blog.code_copy_button_error | escape }}', err));
  });
});
</script>
