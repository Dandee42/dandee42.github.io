{% assign lang = site.active_lang | default: page.lang %}
{% assign trans = site.data[site.active_lang] %}

{% if lang == "cs" %}
<div id="chat-turnstile"></div>

<script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    const TURNSTILE_SITE_KEY = '0x4AAAAAAF8-PXoM-ZzA9--I';
    // Keep in sync with the length check in the n8n workflow
    const MAX_MESSAGE_LENGTH = 500;

    const metadata = {
        current_url: window.location.href,
        page_path: window.location.pathname,
        page_title: document.title,
        turnstileToken: ''
    };

    // Invisible Cloudflare Turnstile: n8n verifies the token before calling the AI.
    // A token is single-use, so the next one is solved right after each message.
    let widgetId = null;
    let token = null;
    const waiting = [];

    function loadTurnstile() {
        if (window.onTurnstileLoad) return;
        window.onTurnstileLoad = () => {
            widgetId = turnstile.render('#chat-turnstile', {
                sitekey: TURNSTILE_SITE_KEY,
                callback: (t) => {
                    token = t;
                    waiting.splice(0).forEach((resolve) => resolve(t));
                },
                'expired-callback': () => { token = null; },
            });
        };
        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
        document.head.appendChild(script);
    }

    async function takeToken() {
        loadTurnstile();
        const t = token || await new Promise((resolve) => {
            waiting.push(resolve);
            setTimeout(() => resolve(''), 15000);
        });
        token = null;
        if (widgetId !== null) turnstile.reset(widgetId);
        return t;
    }

    // Start solving when the chat is opened, so the first message doesn't wait
    document.addEventListener('click', (e) => {
        if (e.target.closest('.chat-window-toggle')) loadTurnstile();
    });

    new MutationObserver(() => {
        const input = document.querySelector('.chat-input textarea');
        if (input && input.maxLength !== MAX_MESSAGE_LENGTH) input.maxLength = MAX_MESSAGE_LENGTH;
    }).observe(document.body, { childList: true, subtree: true });

    createChat({
        webhookUrl: 'https://n8n.daniel-hladik.cz/webhook/c84ece32-c094-454b-920c-b34138ab3a82/chat',
        target: '#n8n-chat',
        mode: 'window',
        chatInputKey: 'chatInput',
        chatSessionKey: 'sessionId',
        loadPreviousSession: true,
        metadata,
        beforeMessageSent: async () => {
            metadata.turnstileToken = await takeToken();
        },
        showWelcomeScreen: false,
        defaultLanguage: 'cs',
        initialMessages: [
            'Dobrý den👋', 'Jmenuji se Danka. Co pro vás mohu udělat?',
        ],
        i18n: {
            cs: {
                title: 'Danka - virtuální asistentka',
                subtitle: "",
                footer: '',
                getStarted: 'Nová konverzace',
                inputPlaceholder: 'Pište sem...',
            },
        },
        enableStreaming: true,
    });

</script>

<script>
(function () {
    var observer = new MutationObserver(function () {
        var wrapper = document.querySelector('.chat-window-wrapper');
        if (!wrapper || wrapper.dataset.hintWired) return;
        wrapper.dataset.hintWired = '1';

        var bubble = document.createElement('div');
        bubble.className = 'chat-bubble-hint';
        bubble.textContent = 'Hledáte něco? Pomůžu Vám!';
        wrapper.appendChild(bubble);

        var timer = localStorage.getItem('chatOpened') ? null : setTimeout(function () {
            bubble.classList.add('visible');
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                ctx.resume().then(function () {
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                });
            } catch (e) {}
        }, 3000);

        var toggle = wrapper.querySelector('.chat-window-toggle');
        if (toggle) {
            toggle.addEventListener('click', function () {
                bubble.classList.remove('visible');
                clearTimeout(timer);
                localStorage.setItem('chatOpened', '1');
            });
        }
    });

    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

<script>
(function () {
    var chatWindow = null;
    var chatWasOpen = false;
    var styleObserver = new MutationObserver(function () {
        var isOpen = chatWindow && chatWindow.style.display !== 'none';
        document.body.classList.toggle('chat-open', isOpen);
        if (isOpen && !chatWasOpen && typeof gtag === 'function') {
            gtag('event', 'chat_opened', {
                event_category: 'engagement',
                event_label: 'n8n chat'
            });
        }
        chatWasOpen = isOpen;
    });

    var domObserver = new MutationObserver(function () {
        var win = document.querySelector('.chat-window');
        if (win && win !== chatWindow) {
            chatWindow = win;
            styleObserver.observe(chatWindow, { attributes: true, attributeFilter: ['style'] });
            document.body.classList.toggle('chat-open', chatWindow.style.display !== 'none');
        }
    });

    domObserver.observe(document.body, { childList: true, subtree: true });
})();
</script>
{% else %}
{% endif %}
