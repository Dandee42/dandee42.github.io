<script defer>
  // 1. Convert title → data-tooltip
  document.querySelectorAll('abbr[title]').forEach(function(el) {
    if (!el.getAttribute('data-tooltip')) {
      el.setAttribute('data-tooltip', el.getAttribute('title'));
    }
    el.setAttribute('aria-label', el.getAttribute('title'));
    el.removeAttribute('title');
  });

  // 2. Create bottom sheet elements (for touch devices and glossary terms)
  var backdrop = document.createElement('div');
  backdrop.className = 'abbr-sheet-backdrop';
  backdrop.setAttribute('aria-hidden', 'true');

  var sheet = document.createElement('div');
  sheet.className = 'abbr-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML =
    '<div class="abbr-sheet-handle-bar"></div>' +
    '<div class="abbr-sheet-header">' +
      '<span class="abbr-sheet-term"></span>' +
      '<button class="abbr-sheet-close" aria-label="Zavřít">&times;</button>' +
    '</div>' +
    '<p class="abbr-sheet-desc"></p>' +
    '<a class="abbr-sheet-link" href="#" style="display:none"></a>';

  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);

  var termEl = sheet.querySelector('.abbr-sheet-term');
  var descEl = sheet.querySelector('.abbr-sheet-desc');
  var closeBtn = sheet.querySelector('.abbr-sheet-close');
  var linkEl = sheet.querySelector('.abbr-sheet-link');
  var glossaryLinkLabel = '{{ site.data[site.active_lang].datapages_glossary.read_more | default: "Read more →" }}';

  function openSheet(abbr) {
    termEl.textContent = abbr.textContent;
    descEl.textContent = abbr.getAttribute('data-tooltip');
    var glossarySlug = abbr.getAttribute('data-glossary');
    if (glossarySlug) {
      var lang = document.documentElement.lang || 'cs';
      var prefix = (lang === 'cs') ? '' : '/' + lang;
      linkEl.href = prefix + '/glossary/' + glossarySlug;
      linkEl.textContent = glossaryLinkLabel;
      linkEl.style.display = '';
    } else {
      linkEl.style.display = 'none';
    }
    backdrop.classList.add('open');
    sheet.classList.add('open');
  }

  function closeSheet() {
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
  }

  var isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  // 3. Bind abbr clicks
  document.querySelectorAll('abbr[data-tooltip]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isTouch || this.hasAttribute('data-glossary')) {
        openSheet(this);
      } else {
        this.classList.toggle('tooltip-visible');
      }
    });
  });

  // 4. Close on backdrop click, close button, or Escape key
  backdrop.addEventListener('click', closeSheet);
  closeBtn.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSheet();
  });

  // 5. Desktop: close tooltip on outside click
  document.addEventListener('click', function() {
    if (!isTouch) {
      document.querySelectorAll('abbr.tooltip-visible')
        .forEach(function(el) { el.classList.remove('tooltip-visible'); });
    }
  });
</script>
