{% assign trans = site.data[site.active_lang] %}

<div class="share-card">
  <p class="share-card__text">
    <strong>{{ trans.blog.share_text_question | escape }}</strong>
    <span>{{ trans.blog.share_text_answer | escape }}</span>
  </p>
  <button type="button" id="shareBtn" class="button--outline">
    <span class="material-symbols-outlined" aria-hidden="true">share</span>
    {{ trans.blog.share_button | escape }}
  </button>
</div>

<script>
(function () {
  const currentLang = document.documentElement.lang || '{{ site.active_lang | default: "cs" }}';

  const translations = {
    cs: {
      shareText: 'Přečti si tento článek',
      copied: 'Odkaz byl zkopírován do schránky!',
      copyError: 'Nepodařilo se zkopírovat odkaz. Zkopírujte ho ručně: '
    },
    en: {
      shareText: 'Check out this article',
      copied: 'Link copied to clipboard!',
      copyError: 'Could not copy the link. Please copy it manually: '
    }
  };

  const t = translations[currentLang] || translations.cs;

  // Short confirmation at the bottom of the screen
  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.setAttribute('role', 'status');
    toast.textContent = message;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('is-visible'));
    setTimeout(() => {
      toast.classList.remove('is-visible');
      setTimeout(() => toast.remove(), 300);
    }, 2200);
  }

  document.getElementById('shareBtn').addEventListener('click', async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: document.title,
          text: t.shareText,
          url: window.location.href
        });
      } catch(err) {
        console.error('Chyba při sdílení:', err);
      }
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast(t.copied);
      } catch (err) {
        alert(t.copyError + window.location.href);
      }
    }
  });
})();
</script>
