<script>
(function () {
  var el = document.querySelector('.tw');
  if (!el) return;

  var words = JSON.parse(el.getAttribute('data-words'));
  var idx = 0;
  var char = words[0].length;
  var deleting = true;

  function tick() {
    var word = words[idx];
    if (deleting) {
      char--;
      el.textContent = word.slice(0, char);
      if (char === 0) {
        deleting = false;
        idx = (idx + 1) % words.length;
        setTimeout(tick, 380);
        return;
      }
      setTimeout(tick, 65);
    } else {
      char++;
      el.textContent = word.slice(0, char);
      if (char === word.length) {
        deleting = true;
        setTimeout(tick, 2000);
        return;
      }
      setTimeout(tick, 110);
    }
  }

  // First pause — let the visitor read the initial word before animation starts
  setTimeout(tick, 2800);
})();
</script>
